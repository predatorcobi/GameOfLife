<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Conwayova Hra Života • Ekosystém</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        
        :root { --tw-color-primary: #00ff88; }
        body { font-family: 'Inter', system_ui, sans-serif; }
        .title-font { font-family: 'Space Grotesk', sans-serif; }

        canvas {
            image-rendering: pixelated;
            box-shadow: 0 0 80px -15px rgb(0 255 136);
            border: 4px solid #00ff88;
            cursor: crosshair;
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 750px;
        }

        .control-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .control-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -3px rgb(0 255 136); }
        .neon-text { text-shadow: 0 0 10px #00ff88, 0 0 25px #00ff88; }
        .species-legend { display: flex; gap: 12px; flex-wrap: wrap; }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col">
    <div class="bg-black border-b border-[#00ff88]/30 py-4 px-8 flex items-center justify-between">
        <div class="flex items-center gap-x-4">
            <div class="w-10 h-10 bg-[#00ff88] rounded-2xl flex items-center justify-center text-zinc-950 font-bold text-3xl rotate-12">🧬</div>
            <div>
                <h1 class="title-font text-4xl tracking-tighter neon-text">CONWAY ULTRA</h1>
                <p class="text-[#00ff88] text-sm font-medium -mt-1 tracking-[3px]">EKOSYSTÉM + ZOOM + MULTI-SPECIES</p>
            </div>
            <div class="ml-6 px-4 py-1 bg-zinc-900 rounded-3xl text-xs font-mono border border-[#00ff88]/20 flex items-center gap-x-2">
                <div class="w-2 h-2 bg-[#00ff88] rounded-full animate-pulse"></div>
                200 × 150 buněk • 60 FPS • Zoom + Pan
            </div>
        </div>

        <div class="flex items-center gap-x-8 text-sm font-medium">
            <div onclick="toggleMode()" id="mode-btn" class="flex items-center gap-x-3 bg-zinc-900 hover:bg-[#00ff88] hover:text-zinc-950 px-5 py-2 rounded-3xl cursor-pointer transition-all">
                <span id="mode-icon" class="text-xl">🌍</span>
                <span id="mode-text" class="font-semibold">EKOSYSTÉM AKTIVNÍ</span>
            </div>
            <button onclick="resetView()" class="control-btn px-5 py-2 bg-zinc-800 hover:bg-white text-white hover:text-zinc-950 rounded-3xl flex items-center gap-x-2 text-sm">🔄 Reset zoom</button>
            <button onclick="toggleFullscreen()" class="flex items-center gap-x-2 hover:text-[#00ff88] transition-colors">⛶ Fullscreen</button>
            <div class="flex items-center gap-x-3">
                <div class="text-xs px-3 py-1.5 bg-zinc-900 rounded-2xl border border-[#00ff88]/30 font-mono flex items-center">
                    <span id="fps-display" class="tabular-nums">60</span>
                    <span class="ml-1 text-zinc-500">fps</span>
                </div>
                <button onclick="sharePattern()" class="px-6 py-2 bg-[#00ff88] hover:bg-white text-zinc-950 rounded-2xl font-semibold flex items-center gap-x-2 text-sm">📤 Sdílet svět</button>
            </div>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden">
        <div class="w-80 bg-zinc-900 border-r border-[#00ff88]/20 flex flex-col overflow-y-auto">
            <div class="p-6 border-b border-[#00ff88]/10">
                <div class="flex gap-3">
                    <button onclick="toggleSimulation()" id="play-btn" class="control-btn flex-1 bg-zinc-800 hover:bg-emerald-500 text-white font-semibold py-5 rounded-3xl flex items-center justify-center gap-x-3 text-xl shadow-lg">
                        <span id="play-icon">▶️</span>
                        <span id="play-text">Spustit</span>
                    </button>
                    <button onclick="stepOnce()" class="control-btn px-7 bg-zinc-800 hover:bg-zinc-700 font-semibold rounded-3xl text-2xl flex items-center justify-center">⏭</button>
                </div>
                <div class="flex justify-between text-xs mt-6 font-mono">
                    <div>Generace: <span id="generation" class="tabular-nums text-[#00ff88] text-lg">0</span></div>
                    <div id="population-label">Živé buňky: <span id="population" class="tabular-nums text-[#00ff88] text-lg">0</span></div>
                </div>
            </div>

            <div class="px-6 pt-6">
                <div class="flex justify-between text-sm mb-2 font-medium"><span>Rychlost simulace</span><span id="speed-value" class="font-mono text-[#00ff88]">40 ms</span></div>
                <input type="range" id="speed-slider" min="1" max="300" value="40" step="1" oninput="updateSpeed(this.value)" class="w-full accent-[#00ff88]">
            </div>

            <div id="brush-panel" class="px-6 pt-6">
                <div class="text-sm font-medium mb-3">Štětec</div>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setBrush(1)" id="brush-1" class="brush-btn flex flex-col items-center py-3 bg-zinc-800 hover:bg-emerald-900 rounded-2xl text-xs font-medium border-2 border-transparent">🌱<br>Rostlina</button>
                    <button onclick="setBrush(2)" id="brush-2" class="brush-btn flex flex-col items-center py-3 bg-zinc-800 hover:bg-blue-900 rounded-2xl text-xs font-medium border-2 border-[#00ff88]">🐛<br>Kořist</button>
                    <button onclick="setBrush(3)" id="brush-3" class="brush-btn flex flex-col items-center py-3 bg-zinc-800 hover:bg-red-900 rounded-2xl text-xs font-medium border-2 border-transparent">🦅<br>Dravec</button>
                    <button onclick="setBrush(0)" id="brush-0" class="brush-btn flex flex-col items-center py-3 bg-zinc-800 hover:bg-zinc-700 rounded-2xl text-xs font-medium border-2 border-transparent">🗑<br>Smazat</button>
                </div>
            </div>

            <div class="px-6 pt-8 grid grid-cols-3 gap-3">
                <button onclick="randomize()" class="control-btn bg-zinc-800 hover:bg-zinc-700 py-4 rounded-3xl font-medium flex flex-col items-center gap-y-1 text-xs"><span class="text-3xl">🎲</span>RANDOM</button>
                <button onclick="clearGrid()" class="control-btn bg-zinc-800 hover:bg-zinc-700 py-4 rounded-3xl font-medium flex flex-col items-center gap-y-1 text-xs"><span class="text-3xl">🧹</span>CLEAR</button>
                <button onclick="toggleWrap()" id="wrap-btn" class="control-btn bg-zinc-800 hover:bg-zinc-700 py-4 rounded-3xl font-medium flex flex-col items-center gap-y-1 text-xs"><span class="text-3xl">🔄</span><span id="wrap-text">TOROID ✓</span></button>
            </div>

            <div class="mt-auto p-6 border-t border-[#00ff88]/10 text-[10px] text-zinc-400 font-mono">
                L-Klik: kreslit • R-Klik: pohyb • Kolečko: zoom
            </div>
        </div>

        <div class="flex-1 flex flex-col bg-black relative p-4">
            <canvas id="canvas" class="mx-auto my-auto"></canvas>
            <div id="zoom-info" class="absolute top-8 right-8 bg-black/70 text-xs font-mono px-3 py-1 rounded-2xl border border-[#00ff88]/30">
                🔎 <span id="zoom-level-display">1.00×</span>
            </div>
        </div>
    </div>

    <script>
        const COLS = 200, ROWS = 150, BASE_CELL_SIZE = 4;
        let canvas, ctx, grid = [], speciesGrid = [], energyGrid = [];
        let mode = 'ecosystem', running = false, toroidal = true, speed = 40;
        let generation = 0, population = 0, zoomLevel = 1.0, panX = 0, panY = 0;
        let lastTick = 0, fpsCounter = 0, fpsLastTime = 0;
        let isPainting = false, isPanning = false, currentBrush = 2, lastMouseX = 0, lastMouseY = 0;
        let stochasticEnabled = true, survivalProb = 0.92, birthProb = 0.88;
        const COLORS = { 1: '#22cc55', 2: '#4488ff', 3: '#ff3366' };

        function initCanvas() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d', { alpha: false });
            
            function resizeCanvasDisplay() {
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                draw();
            }

            window.addEventListener('resize', resizeCanvasDisplay);
            resizeCanvasDisplay();

            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            window.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('wheel', handleWheel, { passive: false });
            canvas.addEventListener('contextmenu', e => e.preventDefault());
        }

        function getGridPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let mx = (e.clientX - rect.left) * scaleX;
            let my = (e.clientY - rect.top) * scaleY;

            mx = (mx - panX) / zoomLevel;
            my = (my - panY) / zoomLevel;

            return { x: Math.floor(mx / BASE_CELL_SIZE), y: Math.floor(my / BASE_CELL_SIZE) };
        }

        function handleWheel(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
            const my = (e.clientY - rect.top) * (canvas.height / rect.height);
            
            const oldZoom = zoomLevel;
            const factor = e.deltaY < 0 ? 1.1 : 0.9;
            zoomLevel = Math.max(0.4, Math.min(zoomLevel * factor, 25));
            
            panX = mx - (mx - panX) * (zoomLevel / oldZoom);
            panY = my - (my - panY) * (zoomLevel / oldZoom);
            updateZoomDisplay();
            draw();
        }

        function handleMouseDown(e) {
            if (e.button === 2) { isPanning = true; lastMouseX = e.clientX; lastMouseY = e.clientY; return; }
            isPainting = true;
            handleMouseMove(e);
        }

        function handleMouseMove(e) {
            if (isPanning) {
                panX += (e.clientX - lastMouseX);
                panY += (e.clientY - lastMouseY);
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                draw();
                return;
            }
            if (!isPainting) return;
            const pos = getGridPos(e);
            if (pos.x >= 0 && pos.x < COLS && pos.y >= 0 && pos.y < ROWS) {
                if (mode === 'classic') grid[pos.y][pos.x] = 1;
                else {
                    speciesGrid[pos.y][pos.x] = currentBrush;
                    energyGrid[pos.y][pos.x] = currentBrush === 1 ? 100 : 70;
                }
                draw();
            }
        }

        function handleMouseUp() { isPainting = false; isPanning = false; }

        function toggleSimulation() {
            running = !running;
            const btn = document.getElementById('play-btn');
            const icon = document.getElementById('play-icon');
            const text = document.getElementById('play-text');
            if (running) {
                icon.textContent = '❚❚'; text.textContent = 'Pauza'; btn.style.backgroundColor = '#f59e0b';
            } else {
                icon.textContent = '▶️'; text.textContent = 'Spustit'; btn.style.backgroundColor = '';
            }
        }

        function countSpecies(type) {
            let count = 0;
            for (let y = 0; y < ROWS; y++) 
                for (let x = 0; x < COLS; x++) 
                    if (speciesGrid[y][x] === type) count++;
            return count;
        }

        function updateUI() {
            document.getElementById('generation').textContent = generation;
            const label = document.getElementById('population-label');
            if (mode === 'ecosystem') {
                label.innerHTML = `🌱${countSpecies(1)} 🐛${countSpecies(2)} 🦅${countSpecies(3)}`;
            } else {
                label.textContent = `Populace: ${grid.flat().filter(Boolean).length}`;
            }
        }

        function simulate() {
            const nextSpecies = speciesGrid.map(r => [...r]);
            const nextEnergy = energyGrid.map(r => [...r]);
            
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const s = speciesGrid[y][x];
                    let neighbors = {1:0, 2:0, 3:0};
                    
                    for(let dy=-1; dy<=1; dy++) {
                        for(let dx=-1; dx<=1; dx++) {
                            if(dx===0 && dy===0) continue;
                            let nx = (x+dx+COLS)%COLS, ny = (y+dy+ROWS)%ROWS;
                            let ns = speciesGrid[ny][nx];
                            if(ns > 0) neighbors[ns]++;
                        }
                    }

                    if (s === 1) { // Rostlina
                        nextEnergy[y][x] = Math.min(100, energyGrid[y][x] + 5);
                    } else if (s === 2) { // Kořist
                        let e = energyGrid[y][x] - 5 + (neighbors[1] * 12);
                        if (e <= 0 || neighbors[2] > 5 || neighbors[3] > 0) nextSpecies[y][x] = 0;
                        nextEnergy[y][x] = e;
                    } else if (s === 3) { // Predátor
                        let e = energyGrid[y][x] - 8 + (neighbors[2] * 20);
                        if (e <= 0 || neighbors[3] > 3) nextSpecies[y][x] = 0;
                        nextEnergy[y][x] = e;
                    } else { // Prázdno -> Zrození
                        if (neighbors[2] === 3) { nextSpecies[y][x] = 2; nextEnergy[y][x] = 60; }
                        else if (neighbors[3] === 3 && neighbors[2] > 0) { nextSpecies[y][x] = 3; nextEnergy[y][x] = 50; }
                        else if (neighbors[1] > 4 && Math.random() < 0.02) { nextSpecies[y][x] = 1; nextEnergy[y][x] = 100; }
                    }
                }
            }
            speciesGrid = nextSpecies; energyGrid = nextEnergy;
            generation++;
        }

        function draw() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(zoomLevel, zoomLevel);

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const s = speciesGrid[y][x];
                    if (s > 0) {
                        ctx.fillStyle = COLORS[s];
                        ctx.globalAlpha = 0.5 + (energyGrid[y][x] / 200);
                        ctx.fillRect(x * BASE_CELL_SIZE, y * BASE_CELL_SIZE, BASE_CELL_SIZE - 0.5, BASE_CELL_SIZE - 0.5);
                    }
                }
            }
            ctx.restore();
        }

        function gameLoop(timestamp) {
            if (running && timestamp - lastTick >= speed) {
                simulate();
                updateUI();
                lastTick = timestamp;
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        function updateZoomDisplay() { document.getElementById('zoom-level-display').textContent = zoomLevel.toFixed(2) + '×'; }
        function updateSpeed(v) { speed = v; document.getElementById('speed-value').textContent = v + ' ms'; }
        function setBrush(b) { currentBrush = b; document.querySelectorAll('.brush-btn').forEach(btn => btn.style.borderColor = 'transparent'); document.getElementById('brush-'+b).style.borderColor = '#00ff88'; }
        function resetView() { zoomLevel = 1; panX = 0; panY = 0; updateZoomDisplay(); draw(); }
        function clearGrid() { speciesGrid = speciesGrid.map(r => r.fill(0)); generation = 0; updateUI(); draw(); }
        
        function randomize() {
            for(let y=0; y<ROWS; y++) {
                for(let x=0; x<COLS; x++) {
                    const r = Math.random();
                    if(r > 0.95) { speciesGrid[y][x]=3; energyGrid[y][x]=70; }
                    else if(r > 0.85) { speciesGrid[y][x]=2; energyGrid[y][x]=70; }
                    else if(r > 0.80) { speciesGrid[y][x]=1; energyGrid[y][x]=100; }
                    else { speciesGrid[y][x]=0; }
                }
            }
            updateUI(); draw();
        }

        window.onload = () => {
            speciesGrid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
            energyGrid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
            initCanvas();
            randomize();
            updateUI();
            updateZoomDisplay();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
